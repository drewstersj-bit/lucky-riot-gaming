# Netlify configuration for Lucky Riot Games (static Next.js export).

[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # Pin the package manager Netlify uses to match package.json.
  PNPM_VERSION = "10.5.0"
  # Netlify enables Corepack automatically when packageManager is set,
  # but we set NPM_FLAGS to avoid an implicit npm install step.
  NPM_FLAGS = "--version"
  # Pre-launch access gate. Keep "true" until you're ready to go public, then
  # set to "false" here (or in Netlify env vars) and redeploy. See README.
  NEXT_PUBLIC_SITE_LOCKED = "true"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# Canonicalise the bare Netlify subdomain / apex handling is managed in the
# Netlify dashboard. Below we handle a couple of friendly redirects.

# Send /home to the root.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# SPA-style fallback is NOT used: this is a fully static multi-page export.
# The custom 404 page is served automatically by Netlify from out/404.html.

# Redirect the previous Cluckus detail URL to the new product page.
[[redirects]]
  from = "/games/cluckus-maximus-eggspander/*"
  to = "/games/cluckus-maximus/"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Edge-enforced access control for the internal PLAYTEST route.
# ---------------------------------------------------------------------------
# The playtest-auth Edge Function runs BEFORE static files are served, so the
# wrapper page and all nested game assets (/dev/game/*) require HTTP Basic Auth.
# Credentials come from Netlify env vars PLAYTEST_AUTH_USER / PLAYTEST_AUTH_PASS
# (never in the repo). The function fails closed if they are unset.
[[edge_functions]]
  function = "playtest-auth"
  path = "/games/cluckus-maximus/dev"

[[edge_functions]]
  function = "playtest-auth"
  path = "/games/cluckus-maximus/dev/*"

# ---------------------------------------------------------------------------
# Security headers (applied to every route)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Site-wide CSP. `frame-src 'self'` is added so the playtest wrapper page can
    # embed the same-origin game iframe; everything else stays strict.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://plausible.io; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# ---------------------------------------------------------------------------
# Game artefact CSP (scoped to the embedded PLAYTEST game only).
# ---------------------------------------------------------------------------
# Slot engines commonly need blob: URLs (audio buffers, workers) and WebAssembly.
# Rather than weaken the whole-site CSP, we relax ONLY the game asset path. If
# the real artefact turns out not to need these, tighten this block. Documented
# as the single, scoped CSP change for Phase 8.3.
[[headers]]
  for = "/games/cluckus-maximus/dev/game/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# ---------------------------------------------------------------------------
# Internal / customer areas — keep out of search indexes at the edge too
# (individual pages also emit a noindex robots meta tag).
# ---------------------------------------------------------------------------
# NOTE: These headers stop indexing but do NOT provide access control.
# /games/cluckus-maximus/dev/* IS access-controlled by the playtest-auth Edge
# Function above (Basic Auth via PLAYTEST_AUTH_USER / PLAYTEST_AUTH_PASS env
# vars). /customer/* still needs real auth before it holds sensitive data.
# Do NOT rely on client-side JavaScript for access control.
[[headers]]
  for = "/customer/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/games/*/dev/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Cache-control for immutable static assets
# ---------------------------------------------------------------------------

# Next.js build output (hashed filenames -> safe to cache forever).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts.
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and other static media.
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Video (served as-is; never re-encoded during builds).
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML documents should always be revalidated.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
